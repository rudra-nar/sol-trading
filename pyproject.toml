[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sol-ew"
version = "0.1.0"
description = "SOL Elliott Wave / Fibonacci Multi-Agent Paper Trading System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "polars>=0.20",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "aiohttp>=3.9",
    "websockets>=12.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "typer[all]>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.90",
    "ruff>=0.1.0",
    "mypy>=1.7",
    "pandas-stubs",
    "types-PyYAML",
]
numba = ["numba>=0.58"]

[project.scripts]
sol_ew = "sol_ew.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["E501", "B008", "E741", "SIM108", "N803", "N806"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
strict = true
mypy_path = "src"
packages = ["sol_ew"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "plotly.*", "numba.*", "hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "leakage: marks tests that verify no-lookahead invariants",
]
